  cells.sort((u,v)=>(v.w-u.w)||(v.m-u.m));
  const bar=cells.map(c=>`<i style="background:${c.toss?'#3a3a3a':col(c.pt).replace('rgb(','rgba(').replace(')',`,${.25+.75*c.a})`)}"><span>${(AB[c.c]||c.c)[0]}</span><span>${(AB[c.c]||c.c)[1]}</span></i>`).join('');
  const names={'中國國民黨':'國民黨','民主進步黨':'民進黨','台灣民眾黨':'民眾黨'};
  const parts=Object.keys(ex).sort((u,v)=>ex[v]-ex[u]).map(pt=>`<span><b style="color:${tcol(pt)}">${names[pt]||'無黨籍'}</b> ${ex[pt].toFixed(1)} ±${Math.sqrt(sd[pt]).toFixed(1)}席</span>`).join('');
  list.insertAdjacentHTML('beforeend',`<div class="sum"><div class="row">${parts}</div><div class="bar">${bar}</div></div>`); }
for(const r of DATA){
  const [a,b]=r.cands; const mid=x=>(x[1]+x[2])/2; const ld=(mid(r.ruleb[0])>=mid(r.ruleb[1]))?a:b;
  const ba=r.base[0],bb=r.base[1]; const rA=r.ruleb[0][0]===a.name?r.ruleb[0]:r.ruleb[1], rB=r.ruleb[0][0]===a.name?r.ruleb[1]:r.ruleb[0];
  const mb=mid(ba)-mid(bb), mf=mid(rA)-mid(rB);
  const polls=r.polls.filter(p=>p.adj&&p.adj[a.name]!=null&&p.adj[b.name]!=null).map(p=>({m:p.adj[a.name]-p.adj[b.name],w:p.w||0,t:`${p.pollster} ${p.date}`})); const wmax=Math.max(1e-6,...polls.map(p=>p.w));
  const pts=[{x:X(mb),k:'base'},...polls.map(p=>({x:X(p.m),k:'poll',t:p.t,r:1.3+3.2*Math.sqrt(p.w/wmax)}))]; const xf=X(mf), xb=X(mb); const sg=r.sigma||0; const e1=X(mf-sg), e2=X(mf+sg);
  const cA=col(a.party), cB=col(b.party); const cf=mf>=0?cA:cB;
  let seg='';
  { const Y1=15,Y2=46; const dx=xf-xb; const s=Math.sign(dx)||1;
    if(Math.abs(dx)>=12){ const x1=xb+s*7, x2=xf-s*2;
      seg+=`<line x1="${x1}" y1="${Y1}" x2="${x2-s*6}" y2="${Y1}" stroke="rgba(17,17,17,.7)" stroke-width="1.4"/><path d="M${x2} ${Y1} l${-s*6} -3.5 l0 7 z" fill="rgba(17,17,17,.7)"/>`; }
    seg+=`<line x1="${xf}" y1="${Math.abs(dx)>=12?Y1+4:Y1+7}" x2="${xf}" y2="${Y2-8}" stroke="rgba(17,17,17,.55)" stroke-width="1.2" stroke-dasharray="3 3"/>`; }
  const zero=`<line x1="${X(0)}" y1="4" x2="${X(0)}" y2="58" stroke="rgba(17,17,17,.18)" stroke-width="1"/>`;
  const PL={'中國國民黨':'K','民主進步黨':'D','台灣民眾黨':'T'}; const lab=m=>`${PL[(m>=0?a:b).party]||'I'}+${Math.abs(m).toFixed(0)}`;
  const TW=34; const Lfit=e1-7-TW>=0, Rfit=e2+7+TW<=Wd;
  const lL=Lfit?`x="${e1-7}" y="50" text-anchor="end"`:`x="${Math.max(e1,2)}" y="36" text-anchor="start"`;
  const lR=Rfit?`x="${e2+7}" y="50" text-anchor="start"`:`x="${Math.min(e2,Wd-2)}" y="36" text-anchor="end"`;
  const mlab=`<text ${lL} font-size="11" font-weight="600" fill="${tcol((mf-sg>=0?a:b).party)}">${lab(mf-sg)}</text><text ${lR} font-size="11" font-weight="600" fill="${tcol((mf+sg>=0?a:b).party)}">${lab(mf+sg)}</text>`;
  const dots=pts.map(p=>p.k==='base'?`<circle cx="${p.x}" cy="15" r="5.5" fill="none" stroke="rgba(17,17,17,.8)" stroke-width="1.5"/>`
    :p.k==='poll'?`<circle cx="${p.x}" cy="15" r="${p.r.toFixed(1)}" fill="rgba(17,17,17,.7)"><title>${p.t}</title></circle>`
    :'').join('')+`<line x1="${e1}" y1="46" x2="${e2}" y2="46" stroke="${cf}" stroke-opacity=".45" stroke-width="3"/><line x1="${e1}" y1="41" x2="${e1}" y2="51" stroke="${cf}" stroke-opacity=".6" stroke-width="1.2"/><line x1="${e2}" y1="41" x2="${e2}" y2="51" stroke="${cf}" stroke-opacity=".6" stroke-width="1.2"/><circle cx="${xf}" cy="46" r="6.5" fill="${cf}"/>${mlab}`;
  const ser=SNAP[r.county]||{}; const lines=[a,b].map(c=>({c,pts:(ser[c.name]||[]).map(([d,p])=>[SX(d),SY(p)])}));
  const grid=[0,25,50,75,100].map(v=>`<line x1="${SL}" y1="${SY(v)}" x2="${Wd}" y2="${SY(v)}" stroke="rgba(17,17,17,${v===50?.28:.1})" stroke-width="1"/><text x="${SL-5}" y="${SY(v)+3.5}" font-size="9" fill="rgba(17,17,17,.55)" text-anchor="end">${v}</text>`).join('')+[7,14,21,28,35,42,49].map(k=>{const xx=SX(new Date(T0+k*864e5).toISOString().slice(0,10));return `<line x1="${xx}" y1="${SY(100)}" x2="${xx}" y2="${SY(0)}" stroke="rgba(17,17,17,.07)" stroke-width="1"/>`}).join('')+`<line x1="${Wd}" y1="${SY(100)}" x2="${Wd}" y2="${SY(0)}" stroke="rgba(17,17,17,.3)" stroke-width="1"/>`;
  const spark=`<svg class="spark" viewBox="0 0 ${Wd} ${SH}" preserveAspectRatio="xMidYMid meet">${grid}${lines.map(L=>{const sc=tcol(L.c.party),sp=L.pts;return (sp.length>1?`<polyline points="${sp.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${sc}" stroke-width="1.6" stroke-linejoin="round"/>`:'')+(sp.length?`<circle cx="${sp[sp.length-1][0].toFixed(1)}" cy="${sp[sp.length-1][1].toFixed(1)}" r="2.4" fill="${sc}"/>`:'');}).join('')}</svg>`;
  const AL={Safe:.26,Likely:.19,Lean:.12,Tilt:.06}; const lv=(r.rating||'').split(' ')[0]; const al=AL[lv]||0;
  const bg=al?cf.replace('rgb(','rgba(').replace(')',`,${al})`):'transparent';
  list.insertAdjacentHTML('beforeend',`<div class="race" style="background:${bg}"><div class="county">${r.county}<div class="wp" style="color:${tcol(ld.party)}">${({"中國國民黨":"國","民主進步黨":"民","台灣民眾黨":"眾"})[ld.party]||"無"} ${r.winprob!=null?r.winprob+"%":""}</div></div>${r.rating?`<span class="tag" style="background:${r.rating.startsWith('Toss')?'rgba(17,17,17,.08)':cf.replace('rgb(','rgba(').replace(')',',.28)')};color:${r.rating.startsWith('Toss')?'#333333':tcol(ld.party)};border-color:rgba(17,17,17,.14)">${r.rating}</span>`:''}<div class="body">
    <div class="names"><span class="c"><span class="n" style="color:${tcol(a.party)}">${a.name}</span><span class="v">${pm(rA)}</span></span><span class="c"><span class="v">${pm(rB)}</span><span class="n" style="color:${tcol(b.party)}">${b.name}</span></span></div>
    <svg viewBox="0 0 ${Wd} 58" preserveAspectRatio="xMidYMid meet">${zero}${seg}${dots}</svg>${spark}</div></div>`);
}
document.documentElement.dataset.h=Math.ceil(document.documentElement.scrollHeight);  /* PNG 高度（build_card.py 出圖讀） */
</script>
