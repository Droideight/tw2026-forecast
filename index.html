    :p.k==='poll'?`<circle cx="${p.x}" cy="15" r="${p.r.toFixed(1)}" fill="rgba(255,255,255,.7)"><title>${p.t}</title></circle>`
    :'').join('')+`<line x1="${e1}" y1="46" x2="${e2}" y2="46" stroke="${cf}" stroke-opacity=".45" stroke-width="3"/><line x1="${e1}" y1="41" x2="${e1}" y2="51" stroke="${cf}" stroke-opacity=".6" stroke-width="1.2"/><line x1="${e2}" y1="41" x2="${e2}" y2="51" stroke="${cf}" stroke-opacity=".6" stroke-width="1.2"/><circle cx="${xf}" cy="46" r="6.5" fill="${cf}"/>${mlab}`;
  const ser=SNAP[r.county]||{}; const lines=[a,b].map(c=>({c,pts:(ser[c.name]||[]).map(([d,p])=>[SX(d),SY(p)])}));
  const grid=[0,25,50,75,100].map(v=>`<line x1="${SL}" y1="${SY(v)}" x2="${Wd}" y2="${SY(v)}" stroke="rgba(255,255,255,${v===50?.28:.1})" stroke-width="1"/><text x="${SL-5}" y="${SY(v)+3.5}" font-size="9" fill="rgba(242,242,240,.45)" text-anchor="end">${v}</text>`).join('')+[7,14,21,28,35,42,49].map(k=>{const xx=SX(new Date(T0+k*864e5).toISOString().slice(0,10));return `<line x1="${xx}" y1="${SY(100)}" x2="${xx}" y2="${SY(0)}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`}).join('')+`<line x1="${Wd}" y1="${SY(100)}" x2="${Wd}" y2="${SY(0)}" stroke="rgba(255,255,255,.3)" stroke-width="1"/>`;
  const spark=`<svg class="spark" viewBox="0 0 ${Wd} ${SH}" preserveAspectRatio="xMidYMid meet">${grid}${lines.map(L=>{const sc=tcol(L.c.party),sp=L.pts;return (sp.length>1?`<polyline points="${sp.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${sc}" stroke-width="1.6" stroke-linejoin="round"/>`:'')+(sp.length?`<circle cx="${sp[sp.length-1][0].toFixed(1)}" cy="${sp[sp.length-1][1].toFixed(1)}" r="2.4" fill="${sc}"/>`:'');}).join('')}</svg>`;
  const AL={Safe:.26,Likely:.19,Lean:.12,Tilt:.06}; const lv=(r.rating||'').split(' ')[0]; const al=AL[lv]||0;
  const bg=al?cf.replace('rgb(','rgba(').replace(')',`,${al})`):'transparent';
  list.insertAdjacentHTML('beforeend',`<div class="race" style="background:${bg}"><div class="county">${r.county}<div class="wp" style="color:${tcol(ld.party)}">${({"中國國民黨":"國","民主進步黨":"民","台灣民眾黨":"眾"})[ld.party]||"無"} ${r.winprob!=null?r.winprob+"%":""}</div></div>${r.rating?`<span class="tag" style="background:${r.rating.startsWith('Toss')?'rgba(255,255,255,.08)':cf.replace('rgb(','rgba(').replace(')',',.28)')};color:${r.rating.startsWith('Toss')?'#D6D6D2':tcol(ld.party)};border-color:rgba(255,255,255,.14)">${r.rating}</span>`:''}<div class="body">
    <div class="names"><span class="c"><span class="n" style="color:${tcol(a.party)}">${a.name}</span><span class="v">${pm(rA)}</span></span><span class="c"><span class="v">${pm(rB)}</span><span class="n" style="color:${tcol(b.party)}">${b.name}</span></span></div>
    <svg viewBox="0 0 ${Wd} 58" preserveAspectRatio="xMidYMid meet">${zero}${seg}${dots}</svg>${spark}</div></div>`);
}
document.documentElement.dataset.h=Math.ceil(document.documentElement.scrollHeight);  /* PNG 高度（build_card.py 出圖讀） */
</script>
